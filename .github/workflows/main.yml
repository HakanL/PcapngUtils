name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: src

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore PcapngUtils.Tests/PcapngUtils.Tests.csproj
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
    - name: Test
      run: dotnet test PcapngUtils.Tests/PcapngUtils.Tests.csproj --no-restore --verbosity normal

  build:
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: Get main version
      id: version
      run: echo "prop=$(jq -r '.version' ../version.json)" >> $GITHUB_OUTPUT

    - name: Set branch name
      run: |
        RAW_BRANCH="${{ github.head_ref != '' && format('PR-{0}', github.head_ref) || github.ref_name }}"
        echo "BRANCH_NAME=${RAW_BRANCH//\//-}" >> $GITHUB_ENV

    - run: echo Branch name ${BRANCH_NAME}

    # Set PACKAGE_VERSION based on event type
    - run: echo "PACKAGE_VERSION=${{steps.version.outputs.prop}}.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
      if: github.ref == 'refs/heads/main' && github.head_ref == ''
    - run: echo "PACKAGE_VERSION=${{steps.version.outputs.prop}}.${GITHUB_RUN_NUMBER}-${BRANCH_NAME}-${GITHUB_SHA::8}" >> $GITHUB_ENV
      if: github.ref != 'refs/heads/main' || github.head_ref != ''
    - run: echo Version is ${PACKAGE_VERSION}

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Install dependencies
      run: dotnet restore PcapngUtils/PcapngUtils.csproj /p:Configuration=Release
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
    - name: Build
      run: dotnet build PcapngUtils/PcapngUtils.csproj --configuration Release --no-restore /p:Version="${PACKAGE_VERSION}"

    ## Publish and Tag (push to main only)
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_USER || github.repository_owner }}
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    - name: Publish NuGet
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        PACKAGE=$(find PcapngUtils/bin/Release -maxdepth 1 -type f -name '*.nupkg' ! -name '*.symbols.nupkg' | head -n 1)
        dotnet nuget push "$PACKAGE" --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
    - name: Tag
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git tag "v${PACKAGE_VERSION}"
        git push origin "v${PACKAGE_VERSION}"
